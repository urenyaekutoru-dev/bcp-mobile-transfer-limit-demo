name: BCP Demo Pipeline

on:
  workflow_dispatch:
    inputs:
      jira_issue:
        description: 'Jira Issue Key'
        required: true
        default: 'BCP-1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build application
        run: |
          python -m py_compile app/transfer_limit.py
          mkdir -p reports
          echo '{"build_status":"success","artifact":"bcp-mobile-transfer-limit"}' > reports/build-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: reports/build-result.json

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          pip install pytest
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/junit.xml

  quality-gate:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate quality results
        run: |
          mkdir -p reports
          cat > reports/software-quality.json <<EOF
          {
            "coverage": 87.4,
            "bugs": 0,
            "code_smells": 3,
            "duplications": 1.2,
            "quality_gate": "PASSED"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: software-quality-results
          path: reports/software-quality.json

  security-scan:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Simulate security scan
        run: |
          mkdir -p reports
          cat > reports/security-scan.json <<EOF
          {
            "critical": 0,
            "high": 0,
            "medium": 1,
            "low": 4,
            "status": "PASSED"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: reports/security-scan.json

  create-change:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Create ServiceNow DevOps Change
        uses: ServiceNow/servicenow-devops-change@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'create-change'
          change-request: >
            {
              "attributes": {
                "short_description": "BCP Mobile Banking deployment",
                "description": "Automated deployment for temporary transfer limit feature. Jira work item: ${{ github.event.inputs.jira_issue }}. Quality gate passed. Coverage: 87.4%. Security scan: 0 critical / 0 high.",
                "chg_model": "5c05c754433a02104a6e556d58b8f278",
                "assignment_group": "0a52d3dcd7011200f2d224837e6103f2",
                "business_service": "3c59afd993c11e10dfacb4c86cba1094",
                "cmdb_ci": "ad69ff288760c2d4a84043b7dabb35fb",
                "implementation_plan": "Deploy through GitHub Actions after successful build, unit testing, quality gate and security validation.",
                "backout_plan": "Rollback previous application package if post-deployment validation fails.",
                "test_plan": "Unit tests passed. Simulated coverage: 87.4%. Smoke tests will run after staging deployment."
              }
            }
          interval: '100'
          timeout: '3600'

  deploy-staging:
    needs: create-change
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to staging..."

  smoke-test:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "Smoke tests passed."

  deploy-production:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to production..."
