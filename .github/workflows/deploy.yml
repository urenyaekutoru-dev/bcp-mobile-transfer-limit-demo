name: BCP Demo Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Simulated build
        run: echo "Building BCP mobile banking package..."

      - name: Simulated deployment to staging
        run: echo "Deploying temporary transfer limit feature to staging..."

      - name: ServiceNow DevOps Change Automation
        uses: ServiceNow/servicenow-devops-change@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'build-test-deploy'
          change-request: '{"setCloseCode":"true","attributes":{"short_description":"BCP Mobile Banking deployment from GitHub Actions","description":"Automated DevOps change created from GitHub Actions for BCP demo pipeline.","assignment_group":"Change Management"}}'
          interval: '100'
          timeout: '3600'

      - name: Simulated production deployment
        run: echo "Deploying release to production..."
