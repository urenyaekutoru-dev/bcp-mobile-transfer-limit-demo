name: BCP Demo Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

      jira_issue:
        description: 'Jira Issue Key'
        required: true
        default: 'BCP-1'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Jira work item context
        run: |
          echo "Jira issue: ${{ github.event.inputs.jira_issue }}"
          echo "Validating work item traceability..."
    
      - name: Checkout repository
        uses: actions/checkout@v5
    
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
    
      - name: Build application
        run: |
          echo "Building BCP mobile banking transfer limit service..."
          python -m py_compile app/transfer_limit.py
    
      - name: Run unit tests
        run: python -m pytest -v
    
      - name: Run security scan
        run: |
          echo "Running simulated SAST and dependency scan..."
          echo "No critical vulnerabilities found."
    
      - name: Package release artifact
        run: |
          mkdir -p dist
          echo "bcp-mobile-transfer-limit-${{ github.run_number }}" > dist/release-artifact.txt
          echo "Artifact packaged successfully."
    
      - name: Create ServiceNow DevOps Change
        uses: ServiceNow/servicenow-devops-change@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'build-test-deploy'
          change-request: >
            {
              "attributes": {
                "short_description": "BCP Mobile Banking deployment",
                "description": "Automated deployment for temporary transfer limit feature.",
                "chg_model": "5c05c754433a02104a6e556d58b8f278",
                "assignment_group": "0a52d3dcd7011200f2d224837e6103f2",
                "business_service": "3c59afd993c11e10dfacb4c86cba1094",
                "cmdb_ci": "ad69ff288760c2d4a84043b7dabb35fb",
                "implementation_plan": "Deploy update using GitHub Actions pipeline and validate transfer limit services.",
                "backout_plan": "Rollback previous application version if deployment validation fails.",
                "test_plan": "Execute automated pytest validation and post-deployment smoke tests."
              }
            }
          interval: '100'
          timeout: '3600'
    
      - name: Deploy to staging
        run: echo "Deploying release to staging..."
    
      - name: Run smoke tests
        run: |
          echo "Testing health endpoint..."
          echo "Testing transfer limit validation..."
          echo "Smoke tests passed."
    
      - name: Simulated release approval gate
        run: |
          echo "Validating change approval and release readiness..."
          echo "Release gate passed."
    
      - name: Deploy to production
        run: echo "Deploying release to production..."
    
      - name: Post-deployment validation
        run: |
          echo "Validating production service..."
          echo "Deployment completed successfully."
