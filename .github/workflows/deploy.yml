name: BCP Demo Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Simulated build
        run: echo "Building BCP mobile banking package..."

      - name: Simulated deployment to staging
        run: echo "Deploying temporary transfer limit feature to staging..."

      - name: Simulated production deployment
        run: echo "Deploying release to production..."
